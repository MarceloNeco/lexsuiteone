<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Trabalhista</title>
<meta name="description" content="Ações trabalhistas novas contra empresas nos tribunais escolhidos, uma por linha, com a ficha da empresa e do processo.">
<!-- Nenhum pedido externo: fontes do próprio sistema. -->
<style>
/* Uma lista, uma linha por ação, clique abre a ficha. Papel branco, tinta marinho, latão só no que pede atenção. */
:root {
  color-scheme: light;
  --papel: #f5f6f8; --folha: #ffffff; --tinta: #121a2b; --tinta-2: #4a5468; --tinta-3: #7a8396; --linha: #e1e5ec; --linha-2: #c9d0db;
  --marinho: #0f1d33; --latao: #a87a2e; --latao-texto: #8a6222; --latao-wash: #f7f0e1; --erro: #a33a2e;
  --f: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --papel: #0f1119; --folha: #161b29; --tinta: #e8ecf3; --tinta-2: #c1c8d5; --tinta-3: #8e97a9; --linha: #27304a; --linha-2: #36405c; --marinho: #0a101c; --latao: #c9a063; --latao-texto: #d6b27a; --latao-wash: #2a2416; --erro: #e07b6e; }
}
:root[data-theme="dark"] { color-scheme: dark; --papel: #0f1119; --folha: #161b29; --tinta: #e8ecf3; --tinta-2: #c1c8d5; --tinta-3: #8e97a9; --linha: #27304a; --linha-2: #36405c; --marinho: #0a101c; --latao: #c9a063; --latao-texto: #d6b27a; --latao-wash: #2a2416; --erro: #e07b6e; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 400 15px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.miolo { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 2px solid var(--latao); outline-offset: 2px; }

header { padding-block: 26px 14px; display: grid; gap: 4px; }
.topo { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.topo .marca { font-weight: 600; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-2); }
.topo .marca b { color: var(--latao-texto); font-weight: 600; }
.pilula { display: inline-flex; border: 1px solid var(--linha-2); border-radius: 999px; overflow: hidden; }
.pilula button { border: 0; background: transparent; padding: 5px 10px; min-height: 30px; font-size: .74rem; font-weight: 600; color: var(--tinta-3); }
.pilula button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
h1 { margin: 6px 0 0; font-size: clamp(1.45rem, 3.4vw, 2rem); font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.resumo { color: var(--tinta-2); margin: 0; }
.resumo b { color: var(--tinta); font-weight: 600; }

/* Barra da tela local: tribunais, período, atualizar. Só aparece quando a página vem do robô. */
.app { display: grid; gap: 10px; margin-bottom: 16px; }
.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seletor, .campo select, .chip, .primario { border: 1px solid var(--linha-2); background: var(--folha); color: var(--tinta); border-radius: 999px; padding: 7px 14px; min-height: 36px; font-size: .86rem; font-weight: 500; }
.seletor { display: inline-flex; align-items: center; gap: 8px; }
.seletor i { font-style: normal; color: var(--tinta-3); font-size: .7rem; }
.campo { display: inline-flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--tinta-2); }
.primario { background: var(--tinta); color: var(--papel); border-color: var(--tinta); font-weight: 600; }
.primario:disabled { opacity: .55; cursor: default; }
.espaco { flex: 1 1 auto; }
.estado { font-size: .86rem; color: var(--tinta-2); display: grid; gap: 2px; }
.estado .ok { color: var(--tinta-2); }
.estado .andando { color: var(--latao-texto); font-weight: 600; }
.estado .log { color: var(--tinta-3); font-size: .8rem; }
.estado .erro { color: var(--erro); }
.painel { background: var(--folha); border: 1px solid var(--linha); border-radius: 10px; padding: 14px 16px; display: grid; gap: 12px; }
.painel-topo { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.abas { display: inline-flex; border: 1px solid var(--linha-2); border-radius: 999px; overflow: hidden; }
.abas button { border: 0; background: transparent; padding: 6px 12px; font-size: .82rem; font-weight: 600; color: var(--tinta-3); }
.abas button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
.painel-acoes { display: flex; gap: 14px; }
.gtrib { border-top: 1px solid var(--linha); padding: 10px 0 4px; }
.gtrib:first-child { border-top: 0; padding-top: 0; }
.gcab { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; padding: 4px 0; }
.gcab small { font-weight: 400; color: var(--tinta-3); }
.gitens { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 18px; padding-left: 4px; }
.titem { display: grid; grid-template-columns: auto auto 1fr auto; gap: 8px; align-items: center; padding: 5px 0; cursor: pointer; font-size: .9rem; }
.titem b { font-weight: 600; min-width: 3.4rem; }
.titem span { color: var(--tinta-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titem small { color: var(--tinta-3); }
.titem input, .gcab input, #c-agendar { width: 16px; height: 16px; margin: 0; accent-color: var(--latao); }
.painel-rodape { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; border-top: 1px solid var(--linha); padding-top: 12px; }
.painel-rodape .cont { color: var(--tinta-2); font-size: .86rem; flex: 1 1 auto; }
.painel .dica { font-size: .8rem; color: var(--tinta-3); }
.ramos { display: flex; flex-wrap: wrap; gap: 6px; }
.ramos .chip { padding: 5px 12px; min-height: 32px; font-size: .82rem; }
.dica-ramo { font-size: .8rem; color: var(--latao-texto); background: var(--latao-wash); border-radius: 8px; padding: 6px 10px; }
.banner { font-size: .88rem; color: var(--latao-texto); background: var(--latao-wash); border-radius: 8px; padding: 8px 12px; }
.banner.erro { color: var(--erro); background: transparent; border: 1px solid var(--erro); }
.painel h3 { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); }
.campo-conf { display: grid; grid-template-columns: minmax(9rem, 12rem) 1fr; gap: 6px 14px; align-items: center; font-size: .9rem; }
.campo-conf > span { color: var(--tinta-3); }
.campo-conf input, .campo-conf select { border: 1px solid var(--linha-2); background: var(--papel); border-radius: 8px; padding: 7px 10px; min-height: 36px; font-size: .9rem; min-width: 0; width: 100%; }
.conf-acoes { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .86rem; color: var(--tinta-2); }
.conf-info { margin: 0; display: grid; grid-template-columns: minmax(9rem, 12rem) 1fr; gap: 4px 14px; font-size: .86rem; }
.conf-info dt { color: var(--tinta-3); }
.conf-info dd { margin: 0; overflow-wrap: anywhere; }
.tag-exc { color: var(--latao-texto); font-weight: 600; }
.ola { margin: 2px 0 0; color: var(--tinta-2); font-size: .95rem; }
.wiz { max-width: 640px; }
.wiz .passos { display: flex; gap: 6px; font-size: .76rem; color: var(--tinta-3); letter-spacing: .04em; text-transform: uppercase; }
.wiz .passos b { color: var(--latao-texto); }
.wiz h3 { font-size: 1.25rem; text-transform: none; letter-spacing: 0; color: var(--tinta); }
.wiz p { margin: 0; color: var(--tinta-2); }
.wiz .campo-conf { grid-template-columns: 1fr; gap: 4px; }
.wiz .campo-conf > span { font-weight: 600; color: var(--tinta); }
.wiz .resumo-final dt { color: var(--tinta-3); } .wiz .resumo-final { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .92rem; }
@media (max-width: 640px) { .campo-conf, .conf-info { grid-template-columns: 1fr; } }

.controles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 12px; }
.chip[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.controles select { border: 1px solid var(--linha-2); background: var(--folha); border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: .84rem; }
.btn-txt { background: none; border: 0; color: var(--latao-texto); font-weight: 600; font-size: .84rem; padding: 6px 4px; }
.btn-txt:hover { text-decoration: underline; }

.lista { background: var(--folha); border: 1px solid var(--linha); border-radius: 10px; overflow: hidden; }
.grupo { font-size: .76rem; font-weight: 600; letter-spacing: .04em; color: var(--tinta-3); padding: 12px 18px 4px; border-top: 1px solid var(--linha); }
.grupo:first-child { border-top: 0; }
.item { border-top: 1px solid var(--linha); }
.item:first-child { border-top: 0; }
.cab { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 3.6rem 1fr auto; gap: 2px 14px; align-items: center; width: 100%; padding: 12px 18px; }
.cab:hover { background: var(--papel); }
.trib { font-size: .74rem; font-weight: 600; color: var(--tinta-3); letter-spacing: .03em; }
.nome { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.nome .mais { font-weight: 400; color: var(--tinta-2); }
.valor { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.valor.vazio { color: var(--tinta-3); font-weight: 500; }
.valor small { display: block; font-size: .72rem; font-weight: 500; color: var(--tinta-3); }
.sub { grid-column: 2 / 4; color: var(--tinta-2); font-size: .86rem; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.sub .tag { color: var(--latao-texto); font-weight: 600; }
.sub .cinza { color: var(--tinta-3); }

.ficha { padding: 2px 18px 18px calc(3.6rem + 18px + 14px); display: grid; grid-template-columns: 1fr 1fr; gap: 14px 32px; }
.ficha h3 { margin: 0 0 8px; font-size: .76rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); }
.ficha dl { margin: 0; display: grid; grid-template-columns: minmax(9rem, max-content) 1fr; gap: 0 14px; font-size: .9rem; }
.ficha dt { color: var(--tinta-3); padding: 5px 0; border-top: 1px solid var(--linha); }
.ficha dd { margin: 0; min-width: 0; overflow-wrap: anywhere; padding: 5px 0; border-top: 1px solid var(--linha); }
.ficha dt:first-of-type, .ficha dd:first-of-type { border-top: 0; }
.ficha dd.num { font-variant-numeric: tabular-nums; overflow-wrap: normal; }
.ficha dd.falta { color: var(--tinta-3); font-style: italic; }
.ficha dd ul { margin: 0; padding-left: 1.1em; }
.ficha .aviso { grid-column: 1 / -1; font-size: .82rem; color: var(--latao-texto); background: var(--latao-wash); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
.ficha .campo-valor { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ficha .campo-valor input { width: 9rem; border: 1px solid var(--linha-2); background: var(--papel); border-radius: 8px; padding: 5px 10px; min-height: 32px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.ficha .campo-valor select { border: 1px solid var(--linha-2); background: var(--papel); border-radius: 8px; padding: 5px 10px; min-height: 32px; font-size: .86rem; }
.acoes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding-top: 8px; border-top: 1px solid var(--linha); }
.acoes a, .acoes .btn-txt { color: var(--latao-texto); font-weight: 600; font-size: .86rem; text-decoration: none; padding: 4px 0; }
.acoes a:hover { text-decoration: underline; }
.nota { grid-column: 1 / -1; font-size: .8rem; color: var(--tinta-3); }
.vazio-lista { padding: 26px 18px; color: var(--tinta-3); }
.mais { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 14px 0 4px; color: var(--tinta-3); font-size: .84rem; }
footer { color: var(--tinta-3); font-size: .78rem; padding: 18px 0 32px; display: grid; gap: 3px; }
footer a { color: var(--latao-texto); font-weight: 600; text-decoration: none; }
footer a:hover { text-decoration: underline; }
@media (max-width: 640px) {
  .cab { grid-template-columns: 1fr auto; }
  .trib { grid-column: 1 / -1; }
  .sub { grid-column: 1 / -1; }
  .ficha { grid-template-columns: 1fr; padding-left: 18px; }
  .ficha dl { grid-template-columns: 1fr; gap: 0; }
  .ficha dt { border-top: 1px solid var(--linha); padding-bottom: 0; }
  .ficha dd { border-top: 0; padding-top: 2px; }
  .gitens { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="miolo">
<header>
  <div class="topo">
    <span class="marca" id="marca"></span>
    <div class="pilula" role="group" aria-label="Idioma / Language"><button type="button" id="b-pt" data-lang="pt">PT</button><button type="button" id="b-en" data-lang="en">EN</button></div>
  </div>
  <h1 id="h1"></h1>
  <p class="resumo" id="resumo"></p>
  <p class="ola" id="ola" hidden></p>
</header>

<section class="painel wiz" id="wizard" hidden>
  <div class="passos" id="w-passos"></div>
  <h3 id="w-titulo"></h3>
  <p id="w-texto"></p>
  <div id="w-p1">
    <label class="campo-conf"><span id="w-l-nome"></span><input id="w-nome" type="text" maxlength="60" autocomplete="given-name"></label>
    <label class="campo-conf"><span id="w-l-papel"></span><select id="w-papel"></select></label>
    <label class="campo-conf"><span id="w-l-escritorio"></span><input id="w-escritorio" type="text" maxlength="80" autocomplete="organization"></label>
  </div>
  <div id="w-p2" hidden>
    <label class="campo-conf"><span id="w-l-pasta"></span><select id="w-pasta"></select></label>
    <label class="campo-conf" id="w-outra-wrap" hidden><span id="w-l-outra"></span><input id="w-outra" type="text" spellcheck="false"></label>
    <div class="conf-acoes"><button type="button" class="chip" id="w-testar"></button><span id="w-teste-txt"></span></div>
  </div>
  <div id="w-p3" hidden>
    <p id="w-trib-txt"></p>
    <label class="conf-acoes"><input type="checkbox" id="w-agendar"> <span id="w-l-agendar"></span></label>
  </div>
  <div id="w-p4" hidden>
    <dl class="resumo-final" id="w-resumo"></dl>
  </div>
  <div class="painel-rodape">
    <span class="cont" id="w-msg"></span>
    <button type="button" class="chip" id="w-voltar"></button>
    <button type="button" class="primario" id="w-avancar"></button>
  </div>
</section>

<section class="app" id="app" hidden>
  <div class="barra">
    <button type="button" class="seletor" id="b-trib" aria-expanded="false"><span id="b-trib-txt"></span><i>▼</i></button>
    <label class="campo"><span id="l-periodo"></span><select id="periodo"></select></label>
    <button type="button" class="seletor" id="b-config" aria-expanded="false"><span id="b-config-txt"></span><i>▼</i></button>
    <span class="espaco"></span>
    <button type="button" class="primario" id="b-rodar"></button>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="estado" id="estado"></div>
  <div class="painel" id="config" hidden>
    <h3 id="c-titulo"></h3>
    <label class="campo-conf"><span id="c-l-nome"></span><input id="c-nome" type="text" maxlength="60" autocomplete="given-name"></label>
    <label class="campo-conf"><span id="c-l-papel"></span><select id="c-papel"></select></label>
    <label class="campo-conf"><span id="c-l-escritorio"></span><input id="c-escritorio" type="text" maxlength="80" autocomplete="organization"></label>
    <label class="campo-conf"><span id="c-l-pasta"></span><select id="c-pasta"></select></label>
    <label class="campo-conf" id="c-outra-wrap" hidden><span id="c-l-outra"></span><input id="c-outra" type="text" spellcheck="false"></label>
    <div class="conf-acoes"><button type="button" class="chip" id="c-testar"></button><span id="c-teste-txt"></span></div>
    <label class="conf-acoes" id="c-agendar-wrap"><input type="checkbox" id="c-agendar"> <span id="c-l-agendar"></span></label>
    <dl class="conf-info" id="c-info"></dl>
    <div class="painel-rodape">
      <span class="cont" id="c-msg"></span>
      <button type="button" class="chip" id="c-atualizar"></button>
      <button type="button" class="primario" id="c-salvar"></button>
    </div>
    <div class="dica" id="c-dica"></div>
  </div>
  <div class="painel" id="painel" hidden>
    <div class="painel-topo">
      <div class="abas" role="group"><button type="button" data-aba="regiao" aria-pressed="true"></button><button type="button" data-aba="uf" aria-pressed="false"></button></div>
      <div class="painel-acoes"><button type="button" class="btn-txt" id="b-todos"></button><button type="button" class="btn-txt" id="b-limpar"></button></div>
    </div>
    <div id="painel-lista"></div>
    <div class="painel-rodape">
      <span class="cont" id="painel-cont"></span>
      <button type="button" class="chip" id="b-salvar"></button>
      <button type="button" class="primario" id="b-salvar-rodar"></button>
    </div>
    <div class="dica" id="painel-dica"></div>
  </div>
</section>

<div class="controles" id="controles">
  <button type="button" class="chip" id="f-valor" aria-pressed="false"></button>
  <button type="button" class="chip" id="f-gig" aria-pressed="false"></button>
  <button type="button" class="chip" id="f-exc" aria-pressed="false" hidden></button>
  <select id="f-trib" aria-label="Tribunal"></select>
  <span class="espaco"></span>
  <select id="ordem" aria-label="Ordenar"></select>
  <button type="button" class="btn-txt" id="exportar"></button>
</div>

<div class="lista" id="lista"></div>
<div class="mais" id="mais" hidden><span id="mais-txt"></span><button type="button" class="chip" id="b-mais"></button></div>

<footer>
  <span id="rodape1"></span>
  <span id="rodape2"></span>
  <span id="rodape3" hidden><a id="link-manual" href="/manual" target="_blank" rel="noopener"></a></span>
</footer>
</div>
