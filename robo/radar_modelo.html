    --verm: #f4958f; --verm-borda: #8a4a4a; --verm-wash: #3f1b1f; --pilula: #111d32;
    --st-novo: #8fb4ea; --csv-bg: #c8a45c; --csv-t: #0b1424; --ok-t: #7fd6a4; --ok-bg: #123327; --al-t: #efbf68; --al-bg: #3b2d10; --er-t: #f4958f; --er-bg: #3f1b1f;
    --g1: #5a8fd6; --g2: #c8a45c; --g3: #8d9bb0; --g4: #3a6cb5; --g5: #9a7a3a; --g6: #c9d1de; --g-apagada: #4a5d7c; --g-outros: #2c3d5c; }
* { box-sizing: border-box; }
/* 0.7.30 (dono, diretriz geral): com janela, Configuração, Perfil, menu ou busca abertos, a página de trás não rola */
html:has(#janela[open]), html:has(#config:not([hidden]):not(.pagina)), html:has(#perfil:not([hidden]):not(.pagina)), html:has(#gaveta:not([hidden])), html:has(#busca-global:not([hidden])) { overflow: hidden; }
#janela, #janela-conteudo, #config, #perfil, #gaveta, .multi-painel, .registro-pre, .busca-global, .bg-res { overscroll-behavior: contain; }
[hidden] { display: none !important; }
/* 0.7.14: a letra cresce com a tela (notebook 16px, monitor 1920 ~19px, 2560 ~21px), regra permanente de uso da tela */
html { font-size: clamp(16px, 0.4vw + 11px, 21px); }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 400 0.94rem/1.5 var(--f); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.miolo { max-width: none; width: 100%; margin: 0 auto; padding-left: max(clamp(16px, 2.6vw, 56px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 2.6vw, 56px), env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 2px solid var(--latao); outline-offset: 2px; }

.faixa { background: var(--noite); color: #eef1f6; margin-bottom: 18px; }
.faixa .miolo { padding-block: 14px 22px; display: grid; gap: 6px; }
header { display: contents; }
/* 0.7.36 (dono): cabeçalho fixo (☰, marca, planilha, manual, busca, ⚙, idioma, perfil); os filtros fixos ficam logo abaixo */
.faixa-topo { position: sticky; top: 0; z-index: 40; margin-bottom: 0; box-shadow: 0 6px 16px -14px rgba(0,0,0,.6); }
.faixa-topo .miolo { padding-block: 10px; }
.faixa-titulo .miolo { padding-block: 2px 22px; }
@media (max-width: 600px) { .faixa-topo { position: static; } }  /* dono (12/Nov): fixo em tudo, menos no celular */
html { scroll-padding-top: var(--topo-h, 0px); }  /* ir para um ponto da página não esconde o alvo atrás do cabeçalho */
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.topo > .b-menu:not([hidden]) + .marca { margin-right: auto; }
.topo .marca { display: inline-flex; align-items: center; gap: 10px; font-size: 1.05rem; color: #fff; }
.topo .marca img { width: 28px; height: 28px; }
.topo .marca .leve { font-weight: 400; } .topo .marca strong { font-weight: 800; } .topo .marca strong b { color: var(--latao-claro); }
.topo .direita { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topo .direita a, .topo .direita button.link { color: #d6dbe6; font-size: .9rem; background: none; border: 0; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
.escritorio-nome { color: #c4cbd8; font-size: .95rem; }
.faixa .pilula { border-color: rgba(255,255,255,.3); } .faixa .pilula button { color: #d6dbe6; } .faixa .pilula button[aria-pressed="true"] { background: #fff; color: var(--noite); }
.faixa h1 { color: #fff; } .faixa .resumo { color: #d6dbe6; } .faixa .resumo b { color: #fff; } .faixa .ola { color: #c4cbd8; }
.planilha-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 7px 16px; min-height: 36px; font-weight: 700; font-size: .88rem; background: var(--latao-claro); color: var(--noite); }
/* A mira do escritório: mesma imagem do passo 1 do site, no alto dos painéis de Tribunais e de Configuração. */
.painel-cab { display: flex; align-items: center; gap: 20px; }
.painel-cab p { margin: 0; color: var(--tinta-2); }
.mira-texto { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.fases { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.fases li { min-width: 0; overflow-wrap: anywhere; hyphens: auto; border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; color: var(--tinta-3); font-size: .86rem; line-height: 1.3; }
.fases li b { color: var(--tinta-2); font-weight: 600; }
@media (max-width: 900px) { .fases { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fases .fase-n { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .78rem; font-weight: 700; background: var(--papel-2, #f1f4f8); color: var(--tinta-2); margin-bottom: 4px; }
.fases li.aqui { border-color: var(--latao); background: var(--latao-wash, #fbf6ea); }
.fases li.aqui b { color: var(--tinta); }
.fases li.aqui .fase-n { background: var(--latao-texto); color: var(--papel); }
::placeholder { color: var(--tinta-2); opacity: 1; }
.fases li.aqui small { color: var(--latao-texto); font-weight: 600; }
.painel-cab p b { display: block; color: var(--tinta); font-size: 1.1rem; margin-bottom: 4px; }

.horas-prontas { display: flex; flex-wrap: wrap; gap: 6px; }
.dias-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; } .dias-linha > span { min-width: 64px; font-size: .86rem; color: var(--tinta-2); }
.dias-semana button { min-width: 52px; }
.horas-prontas button { border: 1px solid var(--linha-2); background: var(--folha); border-radius: 999px; padding: 6px 12px; min-height: 34px; font-weight: 600; cursor: pointer; }
.horas-prontas button[aria-pressed="true"] { background: var(--marinho); color: #fff; border-color: var(--marinho); }
.grupo { font-size: .76rem; font-weight: 600; letter-spacing: .04em; color: var(--tinta-3); padding: 12px 18px 4px; border-top: 1px solid var(--linha); }
.grupo:first-child { border-top: 0; }
.item { background: var(--folha); border: 1px solid var(--linha); border-left: 3px solid var(--latao); border-radius: 10px; overflow: hidden; }
.item:hover { border-color: var(--linha-2); border-left-color: var(--latao); }
.cab { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 3px 14px; align-items: start; width: 100%; padding: 12px 16px; }
.meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .8rem; color: var(--tinta-3); }
.meta .data { color: var(--latao-texto); font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.outras { grid-column: 1 / -1; font-size: .8rem; color: var(--tinta-3); }
.cab:hover { background: var(--papel-2, #f3f5f8); }
.trib { font-size: .74rem; font-weight: 600; color: var(--tinta-3); letter-spacing: .03em; }
.nome { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.nome .mais { font-weight: 400; color: var(--tinta-2); }
.valor { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.valor.vazio { color: var(--tinta-3); font-weight: 500; }
.valor small { display: block; font-size: .72rem; font-weight: 500; color: var(--tinta-3); }
.sub { grid-column: 1 / -1; color: var(--tinta-2); font-size: .86rem; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.sub .tag { color: var(--latao-texto); font-weight: 600; }
.sub .cinza { color: var(--tinta-3); }

.ficha { padding: 2px 18px 18px 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px 32px; }
.ficha > * { min-width: 0; }
.ficha h3 { margin: 0 0 8px; font-size: .76rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); }
.ficha dl { margin: 0; display: grid; grid-template-columns: minmax(8rem, 34%) minmax(0, 1fr); gap: 0 14px; font-size: .9rem; }
.ficha dt { color: var(--tinta-3); padding: 5px 0; border-top: 1px solid var(--linha); }
.ficha dd { margin: 0; min-width: 0; overflow-wrap: anywhere; padding: 5px 0; border-top: 1px solid var(--linha); }
.ficha dt:first-of-type, .ficha dd:first-of-type { border-top: 0; }
.ficha dd.num { font-variant-numeric: tabular-nums; overflow-wrap: normal; }
.ficha dd.falta { color: var(--tinta-3); font-style: italic; }
.ficha dd ul { margin: 0; padding-left: 1.1em; }
.ficha .aviso { grid-column: 1 / -1; font-size: .82rem; color: var(--latao-texto); background: var(--latao-wash); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
.ficha .campo-valor { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ficha .campo-valor input { width: 9rem; max-width: 100%; border: 1px solid var(--linha-2); background: var(--papel); border-radius: 8px; padding: 5px 10px; min-height: 32px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.ficha .campo-valor select { border: 1px solid var(--linha-2); background: var(--papel); border-radius: 8px; padding: 5px 10px; min-height: 32px; font-size: .86rem; }
.acoes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding-top: 8px; border-top: 1px solid var(--linha); }
.acoes a, .acoes .btn-txt { color: var(--latao-texto); font-weight: 600; font-size: .86rem; text-decoration: none; padding: 4px 0; }
.acoes a:hover { text-decoration: underline; }
.nota { grid-column: 1 / -1; font-size: .8rem; color: var(--tinta-3); }
.vazio-lista { padding: 26px 18px; color: var(--tinta-3); }
.mais { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 14px 0 4px; color: var(--tinta-3); font-size: .84rem; }
footer { color: var(--tinta-3); font-size: .78rem; padding: 18px 0 32px; display: grid; gap: 3px; }
footer a { color: var(--latao-texto); font-weight: 600; text-decoration: none; }
footer a:hover { text-decoration: underline; }
@media (max-width: 640px) {
  .cab { grid-template-columns: 1fr auto; }
  .controles { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 10px; scrollbar-width: thin; }
  .controles > * { flex: 0 0 auto; }
  .controles .limpar-filtros { position: sticky; right: 0; z-index: 1; background: var(--papel); box-shadow: -12px 0 10px -4px var(--papel); }  /* revisão da 0.7.28: sempre à vista no celular */
  .controles .espaco { display: none; }
  .ficha { grid-template-columns: 1fr; padding-left: 18px; }
  .ficha dl { grid-template-columns: 1fr; gap: 0; }
  .ficha dt { border-top: 1px solid var(--linha); padding-bottom: 0; }
  .ficha dd { border-top: 0; padding-top: 2px; }
  .gitens { grid-template-columns: 1fr; }
}
</style>
</head>

<script id="assistone-master">
/* =====================================================================

   Versão 1.0.0 (10/Out/2026)
   ---------------------------------------------------------------------
   POR QUE ESTE ARQUIVO EXISTE
   Decisão do dono (10/Out/2026): o AssistONE sai de dentro do módulo comum
   e vira um arquivo só dele, IGUAL em todos os apps (o master fica no
   repositório rootify-one, como o recursos.js). O módulo comum novo
   (diretrizes.js 1.9.0) não tem mais o AssistONE; sem este arquivo, o app
   que trocar o módulo antigo (1.1.x, que tinha DGO.assistente) pelo novo
   perderia o assistente. Com este arquivo, nada muda para quem usa o app:
   mesma aparência, mesmo jeito, e as escolhas da pessoa ("ligado/desligado",
   "já me apresentei", dicas já vistas) continuam valendo, porque as chaves
   guardadas no aparelho são as mesmas do módulo 1.1.4:
       dgo:<app>:pref:aone:ligado   (true/false)
       dgo:<app>:pref:aone:ola      (já mostrou o "Olá! Eu sou o AssistONE")
       dgo:<app>:pref:aone:dicas    ({ tela: 1 } das dicas já mostradas)
       dgo:<app>:pref:aone:tour     (já fez o tour até o fim)

   ORDEM DOS ARQUIVOS NA PÁGINA (o config precisa vir antes deste arquivo):
     <script src="diretrizes.js"><\/script>
     <script src="diretrizes-config.js"><\/script>
     <script src="assistone.js"><\/script>
   O recursos.js (interruptores, para app sem o módulo) pode vir antes ou
   depois, do jeito que o app já faz hoje.

   App SEM o módulo comum: carrega só este arquivo e diz o que o assistente
   sabe do app:
     <script src="assistone.js" data-app="meu-app"><\/script>
     <script>AssistONE.configurar({ app: 'meu-app', nome: 'Meu App', assistente: { telas: {…}, tour: […] } });<\/script>

   O QUE O APP DECLARA (cfg.assistente no diretrizes-config.js — o mesmo
   formato do módulo 1.1.4, então o config dos apps não muda):
       ativo:  true                                // false = este app não tem assistente
       imagem: 'ajuda-botao.png'                   // a arte do personagem (sem ela, um "?")
       tela:   function () { return 'inicio'; }    // padrão: <body data-pagina="...">
       telas:  { inicio: { titulo:{pt,en}, frase:{pt,en}, montar: function () { return elemento },
                           atalhos:[ { rotulo:{pt,en}, acao: function|'#id'|url, principal:true } ] } }
       tour:   [ { seletor:'#busca', titulo:{pt,en}, texto:{pt,en} } ]
       dicas:  { inicio: {pt,en} }                  // uma por tela, uma vez só
       busca:  [ { termo:{pt,en}, sinonimos:['...'], destino: url|'#id'|function, icone:'🎸', descricao:{pt,en} } ]
       wizard: 'inicio'                             // id de um DGO.wizard.definir(...) do app
       esconderCom: ['body.modo-palco']             // com isto visível, o personagem some
       exemploBusca: {pt,en}                        // opcional: o exemplo dentro do campo de busca

   COMO ELE SE ENCAIXA NO MÓDULO COMUM (sem mexer no diretrizes.js, que tem
   que ser igual em todos os apps):
     - lê o config em DGO.cfg (o DGO.iniciar({...}) do diretrizes-config.js
       junta tudo ali) e começa quando o módulo avisa "dgo:pronto";
     - usa o idioma do módulo (DGO.idioma() e o evento "dgo:idioma"), as
       janelas do módulo (.dgo-modal) para saber quando sumir, o DGO.wizard,
       o DGO.feedback (💬) e os interruptores (DGO.recursos);
     - registra DGO.assistente com os mesmos nomes do 1.1.4 (abrir, fechar,
       ligado, ligar, tour, procurar, dica, recomecar, atualizar), para o
       código dos apps que já chama DGO.assistente.* continuar funcionando;
     - ⚙ Configurações: o 1.9.0 não tem um "gancho" para acrescentar seção.

     - recurso "assistone" desligado → o personagem não aparece nem abre, e o
       cartão das Configurações diz "Desligado pela administração da SolverONE.";
     - comportamento "assistone.dicas" = false → nenhuma dica por tela.
     Lê de DGO.recursos (módulo ≥ 1.6.0) ou de SolverRecursos (recursos.js) e

    g_ver_como: "Ver como", g_por_trib: "Separar por tribunal", g_some_so_aqui: "Clique para tirar ou devolver; some só deste gráfico.", g_sep: "Separar por:", g_sep_nada: "Nada", g_sep_trib: "Tribunal", g_sep_sit: "Situação", g_sep_faixa: "Faixa de valor", g_sep_setor: "Setor", g_outros_pilha: "Outros", ultimo_mes: "Último mês", ultimo_mes_off: "Último mês desligado: carregando {d} dias de processos (pode demorar).", g_dia_totais: "Com o Último mês ligado, este gráfico mostra os totais dos últimos 90 dias, guardados a cada leitura, sem os outros filtros do Painel (só o tribunal vale). Os números, os cartões e a Lista mostram os últimos {n} dias.", ultimo_mes_ajuda: "**Para que serve**\nDeixa o programa rápido com muitos processos: a Lista, os números do alto, os cartões das Estatísticas, os filtros e a busca usam só os processos dos **últimos 30 dias**.\n\n**O que continua completo**\nA **Sazonalidade** mostra os meses anteriores.\n\n**Para ver mais**\nDesligue o interruptor, ou escolha 60 ou 90 dias em \"Publicado no Diário\": o interruptor desliga sozinho. Com muitos processos, carregar tudo pode demorar.", g_atualizando: "Volume grande de processos, aguarde…", carregando_dias: "Carregando {d} dias de processos, aguarde…", g_estat: "Estatísticas", g_top: "Quantas empresas mostrar", g_top_n: "Mostrar as {n} primeiras", g_estat_ajuda: "**Riscar e devolver**\nClique num item (na barra, na fatia ou na legenda) para riscá-lo; clique de novo para devolvê-lo. \"Mostrar todos\" devolve tudo daquele cartão.\n\n**Onde o riscado vale**\nEm **Situação, Vara, Tribunal, Setor, Porte, Estado e Tipo de publicação**, o item riscado vale para o Painel inteiro (números do alto e Processos por dia) e aparece no filtro correspondente. Em **Faixas de valor e Empresas**, ele some só daquele cartão (com \"Ver como: Pizza\").\n\n**O que o riscado mostra**\nO item riscado fica apagado e mostra só a quantidade, sem %, porque saiu do total.\n\n**Outros**\nRiscar \"Outros\" mostra mais 6 itens pequenos; o resto continua em \"Outros\". Nas Empresas, quem manda é a escolha 5, 10 ou 15: riscar \"Outros\" só o tira da conta.\n\n**Limpar e Ver na lista**\n\"Limpar filtros\", no alto, desfaz tudo o que foi riscado em qualquer cartão. \"Ver na lista →\" abre a Lista com os mesmos filtros e o mesmo total do cartão (nas Empresas, os processos das empresas mostradas; nas Faixas, \"Acima de…\" quando dá).", g_andamento_dia: "Tracejado: dia em andamento, podem entrar mais processos.", g_andamento_mes: "Tracejado: mês em andamento, podem entrar mais processos.", g_andamento_dia_d: "Dia em andamento: podem entrar mais processos", g_andamento_mes_d: "Mês em andamento: podem entrar mais processos", stp_novo: "Novos", stp_visto: "Vistos", stp_descartado: "Descartados", stp_arquivado: "Arquivados", stp_virou_cliente: "Viraram clientes", g_dica_pilha: "{r}: {n}\n{p}", g_barras: "Barras", g_pizza: "Pizza", g_outros: "Outros ({n})", g_sem_dados: "Sem dados neste período.",
    pp_t: "Estes números: {n} processos", pp_t1: "Estes números: 1 processo", pp_diarios: "Diários de {d} a {a}", pp_filtros: "com {n} filtro(s)", pp_trib: "Tribunal:", pp_trib_todos: "Todos", pp_lidas: "Publicado no Diário:", pp_1: "último dia útil", pp_n: "{d} dias",
    saz_t: "Sazonalidade: processos novos por mês", saz_ajuda: "**Para que serve**\nMostra em que meses e em que dias da semana entram mais processos novos. Ajuda a planejar a equipe e a perceber os picos.\n\n**Como buscar**\nEscolha quantos meses quer ver e clique em **Buscar estatísticas**. O {c} lê os Diários desses meses, do mais recente para o mais antigo. Com 3 tribunais, 12 meses levam **cerca de 1 hora**.\n\n**Pausar e continuar**\n**Pausar** para e guarda o que já foi lido. **Continuar a busca** segue de onde parou. **Continuar à noite** termina sozinho depois da leitura automática da noite.\n\n**Separar por tribunal**\nDivide cada barra pelos tribunais. Passe o mouse sobre a barra para ver o total e cada parte.\n\n**O que entra aqui**\nSó os totais. **Nenhum processo entra na Lista, no Arquivo ou na planilha**, e nada disso vai para a SolverONE. Se o tribunal não tiver mais o Diário de um dia antigo, o dia aparece como \u201csem Diário\u201d.\n\n**Tracejado**\nO mês corrente fica com contorno tracejado até terminar: ainda podem entrar processos.", g_dia_ajuda: "**Para que serve**\nMostra quantos processos novos contra empresas entraram em cada dia, no período escolhido nos filtros do Painel. Clique numa barra para ver só aquele dia.\n\n**Separar as barras**\nEscolha **Tribunal, Situação, Faixa de valor ou Setor** para ver cada barra dividida em partes. Passe o mouse sobre a barra para ver o total e cada parte.\n\n**De onde vêm os números**\nDe cada leitura do Diário. Os totais de cada dia ficam guardados, mesmo depois que o processo sai do Arquivo.\n\n**Tracejado**\nA barra de hoje fica com contorno tracejado: o Diário do dia ainda pode receber processos até a noite. O tracejado sai à meia-noite (horário de Brasília).",

        telas: {
          painel: { titulo: { pt: "Painel", en: "Dashboard" },
            frase: { pt: "Os números dos processos novos contra empresas no período e nos tribunais escolhidos. Passe o mouse num gráfico para ver nome, processos, % e valor numa etiqueta grande; clique num item para tirá-lo ou devolvê-lo (fica riscado e a pizza se refaz só com o que ficou; o gráfico e o filtro são a mesma escolha: o que sai do gráfico aparece no filtro correspondente, com ✕, e conta em \u201cLimpar filtros (N)\u201d); \u201cMostrar todos\u201d desfaz o cartão, \u201cLimpar filtros\u201d desfaz tudo o que foi riscado (inclusive nas pizzas) e \u201cVer na lista →\u201d leva para a Lista. A barra de hoje e o mês corrente ficam tracejados: ainda podem entrar processos. Acima dos cartões, o título Estatísticas tem um (?) que explica o riscar; em Empresas, escolha 5, 10 ou 15 (\u201cVer na lista\u201d leva os processos dessas empresas). O interruptor \u201cÚltimo mês\u201d, ao lado das abas, deixa tudo rápido: a Lista, os números, os cartões e Processos por dia usam só os últimos 30 dias; a Sazonalidade continua completa. O Painel tem filtros próprios, separados dos da Lista (situação e valor no alto; vara, setor, porte e estado em Mais filtros), e sem busca. A cor de cada item se escolhe no quadradinho da legenda. \u201cSeparar por\u201d divide as barras de Processos por dia por tribunal, situação, faixa de valor ou setor. Mais abaixo, os meses anteriores (sazonalidade, com Buscar estatísticas, Pausar e Continuar à noite) e como cada processo foi reconhecido. Quando uma leitura falha, uma faixa vermelha no alto leva ao histórico de leituras e diz se a falha é do CNJ ou deste computador; quando a SolverONE também vê o CNJ fora, a faixa mostra isso.",
                     en: "The figures for new cases against companies in the chosen period and courts. Hover a chart to see name, cases, % and value in a large label; click an item to take it out or bring it back (it is struck through and the pie redraws with what is left; the chart and the filter are the same choice: what leaves the chart shows in the matching filter, with an ✕, and counts in \u201cClear filters (N)\u201d); \u201cShow all\u201d undoes the card, \u201cClear filters\u201d undoes everything struck out (pie charts included) and \u201cSee in the list →\u201d goes to the List. Today\u2019s bar and the current month are dashed: more cases may still come in. Above the cards, the Statistics title has a (?) explaining how to strike items out; in Companies, choose 5, 10 or 15 (\u201cSee in the list\u201d brings those companies\u2019 cases). The \u201cLast month\u201d switch, next to the tabs, keeps everything fast: the List, figures, cards and Cases per day use only the last 30 days; Seasonality stays complete. The Dashboard has its own filters, separate from the List (status and value at the top; court unit, sector, size and state in More filters), and no search box. Pick each item\u2019s colour in the legend square. \u201cSplit by\u201d divides the Cases per day bars by court, status, value range or sector. Further down, previous months (seasonality, with Fetch statistics, Pause and Continue tonight) and how each case was recognised. When a reading fails, a red notice at the top leads to the reading history and says whether the failure is the CNJ's or this computer's; when SolverONE also sees the CNJ down, the notice shows it." },

          lista: { titulo: { pt: "Lista", en: "List" },
            frase: { pt: "Cada cartão é um processo novo contra uma empresa. Mude a situação (Em análise, Contatado, Virou cliente...), complete valor e contato, ou selecione vários cartões para buscar na área logada do tribunal: o programa monta o pedido (até 25 por pedido, padrão), você cola na ferramenta de navegação com o PJe aberto e depois traz a resposta, colada ou em arquivo. Enquanto isso, a faixa no alto da lista mostra o pedido pendente.",

          configuracao: { titulo: { pt: "Configurações", en: "Settings" },
            frase: { pt: "Em blocos: Processos (Destaques e exclusões, seus, neste computador, por área; Filtros salvos; Pasta das planilhas), Leitura do Diário (Rotina de leitura, por dias da semana e horários; Armazenamento), Tela (onde abre, aparência, assistente) e Licença e termos (código de cliente, termos e Sobre este computador). Um Salvar só, que acende quando algo mudou. Da lista, à SolverONE vão só quantidades (por situação, dia, tribunal, frente e faixa de valor); nenhum nome, processo ou contato. Se o Windows não rodar a leitura na hora marcada (por exemplo, por causa do antivírus), a tela aberta lê sozinha. Em Leitura do Diário, a opção \u201cAvisar por e-mail quando o CNJ ficar fora por mais de 4 horas em dia útil\u201d (desligada no começo) manda um e-mail na queda e um na volta. Em Sobre este computador, o antivírus e o firewall encontrados e o link \u201cComo liberar\u201d, com os passos daquele antivírus.",
