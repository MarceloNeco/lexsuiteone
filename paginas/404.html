<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · {{marca.nome}}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root { color-scheme: light; --papel:#fff; --tinta:#0f1d33; --tinta-2:#4a5468; --latao:#c9a063; --latao-texto:#8a6222; --fio:#dbe1ea; }
body { margin:0; background:var(--papel); color:var(--tinta); font: 400 1.0625rem/1.6 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
.miolo { max-width: 40rem; margin: 0 auto; padding: 40px 16px; }
.marca { font-weight:600; font-size:.82rem; letter-spacing:.14em; text-transform:uppercase; color:var(--tinta-2); padding-bottom:18px; border-bottom:1px solid var(--fio); }
.marca b { color: var(--latao-texto); font-weight: 600; }
h1 { font-size: 1.6rem; font-weight: 600; margin: 40px 0 10px; }
p { color: var(--tinta-2); margin: 0 0 10px; }
a { color: var(--latao-texto); }
</style>
</head>
<body>
<div class="miolo">
<div class="marca">LexSuite<b>ONE</b> · {{marca.logo}}</div>
<h1>Página não encontrada</h1>
<p>O endereço que você abriu não existe ou mudou. <a href="/">Voltar ao início</a>.</p>
<p lang="en">Page not found. The address you opened does not exist or has moved. <a href="/">Back to the start</a>.</p>
</div>
</body>
</html>
