name: Testes e segurança

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Testes do robô (só biblioteca padrão)
        working-directory: robo
        run: python -m unittest discover -s testes -v
      - name: Site em dia com o nome do produto (docs/marca.json)
        run: python ferramentas/marca.py --conferir
      - name: Bandit (análise estática de segurança)
        run: |
          python -m pip install --quiet bandit
          bandit -r robo/lexsuite robo/lexsuite_robo.py robo/ferramentas -ll

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (nenhuma chave ou senha no repositório)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
