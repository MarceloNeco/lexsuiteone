name: Testes e segurança

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Testes do robô (só biblioteca padrão)
        working-directory: robo
        run: python -m unittest discover -s testes -v
      - name: Bandit (análise estática de segurança)
        run: |
          python -m pip install --quiet bandit
          bandit -r robo/lexsuite robo/lexsuite_robo.py robo/ferramentas -ll

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks (nenhuma chave ou senha no repositório)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
