        '<span class="g-conta">' + lst.length + (lst.length > 1 ? ' processos' : ' processo') + '</span></div>' + lst.map(function (c) { return cartao(c, n++); }).join('') + '</section>'; });
    $('lista').innerHTML = html; return; }
  $('lista').innerHTML = vis.length ? vis.map(cartao).join('') : '<div class="vazio-lista">Nenhum processo com estes filtros. Tente "Idade do processo: qualquer" ou "No Diário: todos".</div>';
}
document.addEventListener('click', function (e) {
  var cp = e.target.closest('.copiar'); if (cp) { e.stopPropagation(); try { navigator.clipboard.writeText(cp.dataset.c); } catch (x) {} cp.classList.add('feito'); setTimeout(function () { cp.classList.remove('feito'); }, 1400); return; }
  var tt = e.target.closest('.tentar'); if (tt) { tt.textContent = 'Conferindo…'; tt.disabled = true; setTimeout(function () { CASOS.forEach(function (x) { delete x.falha; }); tt.parentNode.outerHTML = '<div class="falha ok">CNJ respondeu agora. Datas e andamentos atualizados.</div>'; }, 1200); return; }
  var gc = e.target.closest('.g-cab'); if (gc) { if (e.target.matches('input')) { gc.parentNode.querySelectorAll('.item input[type=checkbox]').forEach(function (x) { x.checked = e.target.checked; }); return; } gc.parentNode.classList.toggle('fechado'); return; }
  var jr = e.target.closest('.jr-resumo'); if (jr) { jr.parentNode.classList.toggle('aberta'); liga(jr.parentNode); return; }
  var cab = e.target.closest('.cab'); if (cab && !e.target.closest('input')) { cab.parentNode.classList.toggle('aberto'); return; }
  ['trib', 'uf'].forEach(function (id) { var m = $('m-' + id); if (e.target.closest('#b-' + id)) m.classList.toggle('aberto'); else if (!e.target.closest('#m-' + id)) m.classList.remove('aberto'); });
  if (e.target.id === 'b-mais') { $('mais').classList.toggle('aberto'); e.target.classList.toggle('on'); }
  if (e.target.id === 'limpar') { $('busca').value = ''; $('periodo').value = '0'; $('idade').value = '0'; $('andamento').value = ''; F.tribs = {}; F.ufs = {}; desenha(); }
});
['busca', 'periodo', 'idade', 'andamento', 'ordem', 'ordem2', 'agrupar'].forEach(function (id) { $(id).addEventListener(id === 'busca' ? 'input' : 'change', desenha); });
/* linha fina em degrau: do último marco da esquerda (embaixo) ao primeiro da direita (em cima), pelo vão entre as colunas */
function liga(jr) {
  var t = jr.querySelector('.jr-todos'); if (!t) return; var v = t.querySelector('svg.liga'); if (v) v.remove();
  var cols = t.querySelectorAll('ul'); if (cols.length < 2 || !jr.classList.contains('aberta') || innerWidth <= 760) return;
  var base = t.getBoundingClientRect(), ult = cols[0].lastElementChild, pri = cols[1].firstElementChild; if (!ult || !pri) return;
  var a = ult.getBoundingClientRect(), b = pri.getBoundingClientRect(), vao = t.querySelector('.seta-col').getBoundingClientRect();
  var fimTexto = 0; ult.querySelectorAll('*').forEach(function () {}); var rg = document.createRange(); rg.selectNodeContents(ult); fimTexto = rg.getBoundingClientRect().right;
  var y1 = a.top - base.top + 14, y2 = b.top - base.top + 14, x1 = fimTexto - base.left + 10, xm = vao.left - base.left + vao.width / 2, x2 = cols[1].getBoundingClientRect().left - base.left - 14;
  v = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); v.setAttribute('class', 'liga');
  v.innerHTML = '<circle cx="' + x1 + '" cy="' + y1 + '" r="2.2" fill="#9aa3b2"/><path d="M' + x1 + ' ' + y1 + ' H' + xm + ' V' + y2 + ' H' + (x2 - 5) + '" fill="none" stroke="#9aa3b2" stroke-width="1.2"/><path d="M' + (x2 - 6) + ' ' + (y2 - 3.5) + ' L' + x2 + ' ' + y2 + ' L' + (x2 - 6) + ' ' + (y2 + 3.5) + ' Z" fill="#9aa3b2"/>';
  t.appendChild(v);
}
window.addEventListener('resize', function () { document.querySelectorAll('.jr.aberta').forEach(liga); });
var regua = document.createElement('canvas').getContext('2d');
function ajusta(sel) { var cs = getComputedStyle(sel); regua.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily; var o = sel.options[sel.selectedIndex]; sel.style.width = Math.ceil(regua.measureText(o ? o.textContent : '').width + 46) + 'px'; }
function cabe() {
  ['periodo', 'sit', 'valor', 'ordem', 'ordem2', 'agrupar', 'alcance'].forEach(function (id) { ajusta($(id)); });  /* como o programa: cada seletor do tamanho do texto escolhido */  /* como o programa: no notebook, os rótulos encurtam para caber numa linha */
  var l = document.querySelector('.linha1'); l.classList.remove('curta'); $('b-mais').textContent = 'Mais filtros ▾'; var n = l.scrollWidth > l.clientWidth + 1; l.classList.toggle('curta', n);
  $('busca').placeholder = n ? 'Procurar…' : 'Procurar empresa, nº ou CNPJ';
  var o = document.querySelector('.ordenacao'), csv = o.querySelector('.csv'); csv.textContent = '⤓ Baixar a lista (.csv)'; if (o.scrollWidth > o.clientWidth + 1) csv.textContent = '⤓ .csv'; $('b-mais').textContent = n ? 'Mais ▾' : 'Mais filtros ▾';
}
window.addEventListener('resize', cabe);
desenha(); cabe();
['periodo','ordem','ordem2','agrupar','alcance'].forEach(function (id) { $(id).addEventListener('change', cabe); });
