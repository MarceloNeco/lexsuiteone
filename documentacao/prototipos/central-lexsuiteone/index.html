<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Central LexSuiteONE · protótipo</title>
<!-- PROTÓTIPO (13/Nov/2026, Produto): dados FICTÍCIOS, sem login de verdade e sem nenhum pedido à internet.
     Serve para o dono ver e aprovar o desenho antes de qualquer código de nuvem (regra zero). -->
<style>
:root {
  --papel: #f3f5f8; --folha: #fff; --tinta: #121a2b; --tinta-2: #4a5468; --tinta-3: #636e81; --linha: #e1e5ec;
  --marinho: #0f1d33; --latao: #a87a2e; --latao-claro: #d4ab6a; --latao-wash: #f7f0e1;
  --ok-t: #1f6b3a; --ok-bg: #e3f3e8; --al-t: #8a5a00; --al-bg: #fbefd5; --er-t: #a33a2e; --er-bg: #fbe6e3; --barra: #2b62ad;
  --f: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
:root[data-tema="escuro"] { color-scheme: dark; --papel: #0b1424; --folha: #111d32; --tinta: #e4e9f1; --tinta-2: #a8b3c5; --tinta-3: #8190a6;
  --linha: #24344e; --marinho: #0f1d33; --latao: #b58a3c; --latao-wash: #241d10; --ok-t: #8fd3a5; --ok-bg: #12301f; --al-t: #f0c36b; --al-bg: #33270e;
  --er-t: #f4958f; --er-bg: #3a1a17; --barra: #5a8fd6; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.45 var(--f); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--latao); outline-offset: 2px; }
.aviso-proto { background: var(--latao-wash); color: var(--tinta); text-align: center; font-size: .85rem; padding: 6px 12px; border-bottom: 1px solid var(--linha); }
header { background: var(--marinho); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 18px; position: sticky; top: 0; z-index: 5; }
header .marca { font-weight: 800; letter-spacing: .02em; flex: 1; }
header .marca span { color: var(--latao-claro); }
header .marca small { font-weight: 400; opacity: .75; margin-left: 8px; }
header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; min-width: 44px; min-height: 36px; padding: 0 12px; }
header button[aria-pressed="true"] { background: #fff; color: var(--marinho); }
nav.abas { display: flex; gap: 4px; padding: 10px 18px 0; overflow-x: auto; border-bottom: 1px solid var(--linha); background: var(--folha); }
nav.abas button { border: 0; background: transparent; color: var(--tinta-2); padding: 10px 14px; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.abas button[aria-selected="true"] { color: var(--tinta); font-weight: 700; border-bottom-color: var(--latao); }
main { padding: 18px; max-width: 1400px; margin: 0 auto; }
h2 { margin: 6px 0 4px; font-size: 1.25rem; } .sub { color: var(--tinta-3); margin: 0 0 16px; font-size: .92rem; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--folha); border: 1px solid var(--linha); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left; color: inherit; }
.kpi .r { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); }
.kpi .v { font-size: 1.9rem; font-weight: 800; } .kpi .d { font-size: .85rem; color: var(--tinta-2); }
.kpi.alerta { border-color: var(--er-t); } .kpi.atencao { border-color: var(--al-t); }
.cartao { background: var(--folha); border: 1px solid var(--linha); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.cartao h3 { margin: 0 0 10px; font-size: .9rem; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.grade2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
@media (max-width: 600px) { .grade2 { grid-template-columns: 1fr; } main { padding: 12px; } }
.trts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.trt { border-radius: 10px; padding: 10px 12px; border: 1px solid var(--linha); background: var(--folha); text-align: left; color: inherit; }
.trt b { display: block; } .trt small { color: var(--tinta-3); }
.selo { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .78rem; font-weight: 700; }
.ok { color: var(--ok-t); background: var(--ok-bg); } .lento { color: var(--al-t); background: var(--al-bg); } .fora { color: var(--er-t); background: var(--er-bg); }
.trt.fora { border-color: var(--er-t); } .trt.lento { border-color: var(--al-t); }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linha); vertical-align: top; }
th { position: sticky; top: 0; background: var(--folha); color: var(--tinta-2); font-weight: 600; }
.rolagem { overflow-x: auto; }
.barras { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding-top: 10px; }
.barras i { flex: 1; background: var(--barra); border-radius: 3px 3px 0 0; min-width: 4px; }
.leg { display: flex; justify-content: space-between; font-size: .75rem; color: var(--tinta-3); }
.linha-b { display: grid; grid-template-columns: 90px 1fr 60px; gap: 8px; align-items: center; margin: 6px 0; font-size: .9rem; }
.linha-b .t { background: var(--papel); border-radius: 4px; height: 12px; } .linha-b .t i { display: block; height: 100%; border-radius: 4px; background: var(--barra); }
.nota { font-size: .85rem; color: var(--tinta-3); }
.falta { border-left: 4px solid var(--latao); background: var(--latao-wash); padding: 10px 14px; border-radius: 8px; font-size: .9rem; margin-bottom: 14px; }
/* tela de entrada (simulada) */
#entrada { min-height: calc(100vh - 32px); display: grid; place-items: center; padding: 20px; }
#entrada .caixa { background: var(--folha); border: 1px solid var(--linha); border-radius: 14px; padding: 26px; width: min(420px, 100%); }
#entrada label { display: block; font-size: .88rem; color: var(--tinta-2); margin: 12px 0 4px; }
#entrada input { width: 100%; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 8px; background: var(--papel); color: var(--tinta); font: inherit; }
.botao { background: var(--marinho); color: #fff; border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; margin-top: 18px; width: 100%; }
:root[data-tema="escuro"] .botao { background: var(--latao); color: #111; }
</style>
</head>
<body>
<div class="aviso-proto" id="aviso-proto"></div>

<div id="entrada">
  <div class="caixa">
    <h1 style="margin:0;font-size:1.3rem">Central <span style="color:var(--latao)">LexSuiteONE</span></h1>

    <label for="e-email" id="e-l-email"></label><input id="e-email" type="email" autocomplete="username" value="dono@exemplo.com.br">
    <label for="e-senha" id="e-l-senha"></label><input id="e-senha" type="password" autocomplete="current-password" value="••••••••••">
    <label for="e-cod" id="e-l-cod"></label><input id="e-cod" inputmode="numeric" autocomplete="one-time-code" value="123 456">
    <button class="botao" id="e-entrar"></button>
    <p class="nota" id="e-nota"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="marca">Central <span>LexSuiteONE</span><small id="h-prod"></small></div>
    <button id="b-pt" aria-pressed="true">PT</button><button id="b-en" aria-pressed="false">EN</button>
    <button id="b-tema" aria-label="Tema">◐</button>
    <button id="b-sair"></button>
  </header>
  <nav class="abas" role="tablist" id="abas"></nav>
  <main id="tela"></main>
</div>

/* ---------- dados FICTÍCIOS (sorteio fixo, sempre igual) ---------- */

});
var HIST24 = []; for (var h = 0; h < 96; h++) HIST24.push(h > 52 && h < 60 ? 14 + Math.round(rnd() * 6) : 22 + Math.round(rnd() * 2));
